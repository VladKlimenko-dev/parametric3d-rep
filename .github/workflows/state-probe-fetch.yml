# Забрать артефакты уже идущего или законченного прогона state-probe в ветку ya1/state-probe-partial (журналы — текст).
name: state-probe-fetch
on:
  push:
    branches: [ya1/state-probe]
    paths: ['.github/workflows/state-probe-fetch.yml']
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 42026489632
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'res-*'
          path: art
      - uses: actions/download-artifact@v4
        with:
          run-id: 42026489632
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: build
          path: art/build
      - name: В ветку ya1/state-probe-partial
        run: |
          mkdir out && cp -r art/res-*/* out/ 2>/dev/null; cp art/build/* out/ 2>/dev/null; ls -la out
          cd out && git init -q -b ya1/state-probe-partial
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "partial state-probe run 42026489632"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ya1/state-probe-partial
