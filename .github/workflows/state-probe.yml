# Цель Я1: зависит ли шаг от истории сеанса (BACKLOG k149, корпус s106; REFERENCE_SOLUTIONS, п. 6).
# Сборка K01Checks на машинах GitHub (Linux) и прогоны со сверкой «шаг в сеансе = тот же шаг из файла без тел»
# (SEQ_REBUILDCHECK=1) и наборы проверок. Каждый прогон кладёт итог в свою ветку ya1/res/<имя>.
name: state-probe

on:
  push:
    branches: [ya1/state-probe]
    paths:
      - '.github/workflows/state-probe.yml'
      - 'tests/k01/**'
      - 'src/Kernel/**'
      - 'src/Model/**'
      - 'src/Core/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-probe-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Сборка K01Checks
        run: dotnet build tests/k01/K01Checks.csproj -c Release -o out/k01 -v q --nologo 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Итог сборки — в ветку ya1/res/build
        if: always()
        run: |
          mkdir -p res && cp build.log res/
          (DOTNET_TieredCompilation=0 out/k01/K01Checks globals > res/globals.txt 2>&1 || true)
          cd res && git init -q -b r && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "build ${GITHUB_SHA::7}" && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" r:ya1/res/build
      - uses: actions/upload-artifact@v4
        with:
          name: k01-bin
          path: out/k01
          retention-days: 2

  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: k182_sld0, cmd: 'sldprt tests/k01/data/sw_pipe_fitting_761.SLDPRT tests/k01/data/sw_pipe_fitting_366.SLDPRT tests/k01/data/sw_6261k973_roller_chain.SLDPRT', env: 'P3D_SLDOUT=res/out' }
          - { name: k182_sld1, cmd: 'sldprt tests/k01/data/sw_hydraulic_valve.SLDPRT tests/k01/data/sw_5413k55_hose_and_tube.SLDPRT tests/k01/data/sw_60645k113_joint_rod_end.SLDPRT tests/k01/data/sw_alloy20_fitting.SLDPRT tests/k01/data/sw_pipe_fitting_16.SLDPRT tests/k01/data/sw_6264k521_resistant_roller_chain.SLDPRT tests/k01/data/sw_91812a798_wedge_lock_washer.SLDPRT tests/k01/data/sw_conical_spring.SLDPRT tests/k01/data/sw_hex_screw.SLDPRT tests/k01/data/sw_hex_nut.SLDPRT tests/k01/data/sw_cable_holder_b.SLDPRT tests/k01/data/sw_cutting_wheel.SLDPRT tests/k01/data/sw_97633a170_external_retaining_ring.SLDPRT', env: 'P3D_SLDOUT=res/out' }
          - { name: k182_sld2, cmd: 'sldprt tests/k01/data/sw_tube_cutter.SLDPRT tests/k01/data/sw_pipe_fitting_53.SLDPRT tests/k01/data/sw_pipe_fitting_216.SLDPRT tests/k01/data/sw_pipe_fitting_41.SLDPRT tests/k01/data/sw_metal_bevel_gear.SLDPRT tests/k01/data/sw_cable_holder_a.SLDPRT tests/k01/data/sw_90293a104_pin_with_ring.SLDPRT tests/k01/data/sw_bevel_pinion.SLDPRT tests/k01/data/sw_4810t186_steel_pipe_fitting.SLDPRT tests/k01/data/sw_91705a500_nut_style_hangers.SLDPRT tests/k01/data/sw_92146a038_split_lock_washer.SLDPRT tests/k01/data/sw_9271k53_torsion_spring.SLDPRT tests/k01/data/sw_98296a121_slotted_spring_pin.SLDPRT tests/k01/data/sw_90107a038_stainless_steel_washer.SLDPRT', env: 'P3D_SLDOUT=res/out' }
          - { name: k182_sld3, cmd: 'sldprt tests/k01/data/sw_4715k44_inline_hydraulic_valve.SLDPRT tests/k01/data/sw_9657k294_compression_spring.SLDPRT tests/k01/data/sw_4830k221_steel_pipe_nipple.SLDPRT tests/k01/data/sw_4548k221_steel_pipe_nipple.SLDPRT tests/k01/data/sw_59935k11_joint_rod_end.SLDPRT tests/k01/data/sw_pan_phillips_screw.SLDPRT tests/k01/data/sw_9657k259_compression_spring.SLDPRT tests/k01/data/sw_9044k31_steel_extension_spring.SLDPRT tests/k01/data/sw_plastic_bevel_gear.SLDPRT tests/k01/data/sw_6529k16_metal_miter_gear.SLDPRT tests/k01/data/sw_finishing_nail.SLDPRT tests/k01/data/sw_7929k43_needle_roller_bearing.SLDPRT tests/k01/data/sw_6529k53_metal_miter_gear.SLDPRT tests/k01/data/sw_steel_nail.SLDPRT', env: 'P3D_SLDOUT=res/out' }
          - { name: k182_sld4, cmd: 'sldprt tests/k01/data/sw_pipe_fitting_316.SLDPRT tests/k01/data/sw_pipe_fitting_256.SLDPRT tests/k01/data/sw_tube_cutter_compact.SLDPRT tests/k01/data/sw_96605k22_steel_extension_spring.SLDPRT tests/k01/data/sw_check_valve.SLDPRT tests/k01/data/sw_5709k421_with_steel_ring.SLDPRT tests/k01/data/sw_6383k22_steel_ball_bearing.SLDPRT tests/k01/data/sw_locknut_b.SLDPRT tests/k01/data/sw_57545k633_steel_worm.SLDPRT tests/k01/data/sw_6010n12_metal_bevel_pinion.SLDPRT tests/k01/data/sw_ball_stud.SLDPRT tests/k01/data/sw_socket_screw.SLDPRT tests/k01/data/sw_flat_sprocket.SLDPRT tests/k01/data/sw_98430a156_external_retaining_rings.SLDPRT tests/k01/data/sw_98306a210_steel_clevis_pin.SLDPRT tests/k01/data/sw_97633a130_external_retaining_ring.SLDPRT', env: 'P3D_SLDOUT=res/out' }
          - { name: k182_allA, cmd: 'allA', env: '' }
          - { name: k182_allB, cmd: 'allB', env: '' }
          - { name: k182_sldv, cmd: 'sldprt tests/k01/data/sw_pan_phillips_screw.SLDPRT tests/k01/data/sw_9657k294_compression_spring.SLDPRT tests/k01/data/sw_cable_holder_b.SLDPRT', env: 'P3D_XTBLENDEDGE=0' }
          - { name: k182_sldl, cmd: 'sldprt tests/k01/data/sw_locknut_a.SLDPRT tests/k01/data/sw_pipe_fitting_16.SLDPRT', env: 'P3D_SLDPROF=1 P3D_SLDTIMEOUT=1500' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: k01-bin
          path: out/k01
      - name: Прогон ${{ matrix.name }}
        run: |
          chmod +x out/k01/K01Checks
          mkdir -p res/out
          export DOTNET_TieredCompilation=0 SEQ_REBUILDCHECK=1 P3D_USERMODELS="$PWD/tests/ui/data"
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          CMD="${{ matrix.cmd }}"; CMD="${CMD/OUT/res/out}"
          start=$(date +%s)
          timeout 330m out/k01/K01Checks $CMD > res/run.log 2> res/run.err || echo "exit $?" >> res/run.err
          echo "seconds $(( $(date +%s) - start )) nproc $(nproc) env ${{ matrix.env }} cmd $CMD" >> res/run.err
          find res -name '*.p3d' -size +20M -delete
      - name: Итог — в ветку ya1/res/${{ matrix.name }}
        if: always()
        run: |
          cd res && git init -q -b r && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "${{ matrix.name }} ${GITHUB_SHA::7}" && git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" r:ya1/res/${{ matrix.name }}
